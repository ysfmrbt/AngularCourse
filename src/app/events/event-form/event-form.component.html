<form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="p-fluid">
  <!-- Title Field -->
  <div class="field mb-4">
    <label for="titre" class="block mb-2">Titre</label>
    <input id="titre" type="text" pInputText placeholder="Titre de l'événement" formControlName="titre"
      [ngClass]="{'ng-invalid ng-dirty': eventForm.get('titre')?.invalid && eventForm.get('titre')?.touched}" />
    <small *ngIf="eventForm.get('titre')?.invalid && eventForm.get('titre')?.touched" class="p-error">
      Le titre est requis.
    </small>
  </div>

  <!-- Location Field -->
  <div class="field mb-4">
    <label for="lieu" class="block mb-2">Lieu</label>
    <input id="lieu" type="text" pInputText placeholder="Lieu de l'événement" formControlName="lieu"
      [ngClass]="{'ng-invalid ng-dirty': eventForm.get('lieu')?.invalid && eventForm.get('lieu')?.touched}" />
    <small *ngIf="eventForm.get('lieu')?.invalid && eventForm.get('lieu')?.touched" class="p-error">
      Le lieu est requis.
    </small>
  </div>

  <!-- Date Fields -->
  <div class="formgrid grid mb-4">
    <div class="field col">
      <label for="date_debut" class="block mb-2">Date de début</label>
      <p-calendar inputId="date_debut" formControlName="date_debut" [showIcon]="true" dateFormat="dd/mm/yy"
        inputStyleClass="w-full" styleClass="w-full"
        [ngClass]="{'ng-invalid ng-dirty': eventForm.get('date_debut')?.invalid && eventForm.get('date_debut')?.touched}"></p-calendar>
      <small *ngIf="eventForm.get('date_debut')?.invalid && eventForm.get('date_debut')?.touched" class="p-error">
        Date de début requise.
      </small>
    </div>
    <div class="field col">
      <label for="date_fin" class="block mb-2">Date de fin</label>
      <p-calendar inputId="date_fin" formControlName="date_fin" [showIcon]="true" dateFormat="dd/mm/yy"
        inputStyleClass="w-full" styleClass="w-full"
        [ngClass]="{'ng-invalid ng-dirty': eventForm.get('date_fin')?.invalid && eventForm.get('date_fin')?.touched}"></p-calendar>
      <small
        *ngIf="eventForm.get('date_fin')?.invalid && eventForm.get('date_fin')?.touched && !eventForm.errors?.['dateRange']"
        class="p-error">
        Date de fin requise.
      </small>
      <small *ngIf="eventForm.errors?.['dateRange'] && eventForm.get('date_fin')?.touched" class="p-error">
        La date de fin doit être postérieure à la date de début.
      </small>
    </div>
  </div>

  <div class="flex justify-content-end gap-2 mt-4">
    <p-button type="button" label="Annuler" icon="pi pi-times" (onClick)="onCancel()"
      styleClass="p-button-text"></p-button>
    <p-button type="submit" label="Enregistrer" icon="pi pi-check" [disabled]="eventForm.invalid"></p-button>
  </div>
</form>
