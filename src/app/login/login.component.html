<div class="login-container">
  <p-toast></p-toast>
  <p-card header="Login" styleClass="login-card shadow-2">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field mb-4">
        <label for="username" class="block mb-2">Username</label>
        <input id="username" type="text" pInputText formControlName="username" class="w-full"
          placeholder="Enter username" />
        <small *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          class="p-error block mt-1">Username is required.</small>
      </div>

      <div class="field mb-4">
        <label for="password" class="block mb-2">Password</label>
        <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true"
          placeholder="Enter password" styleClass="w-full" inputStyleClass="w-full"></p-password>
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          class="p-error block mt-1">Password is required.</small>
      </div>

      <p-button label="Login" type="submit" icon="pi pi-sign-in" [loading]="loading" styleClass="w-full"></p-button>
    </form>
  </p-card>
</div>
