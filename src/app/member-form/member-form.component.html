<h2 mat-dialog-title>{{ isEditMode ? 'Modifier le membre' : 'Ajouter un membre' }}</h2>
<form [formGroup]="memberForm" (ngSubmit)="onSubmit()" class="p-fluid p-4">
  <!-- CIN Field -->
  <div class="field mb-4">
    <label for="cin" class="block font-semibold mb-2">CIN</label>
    <input id="cin" type="text" pInputText placeholder="CIN" formControlName="cin" class="w-full">
    <small class="p-error block" *ngIf="memberForm.get('cin')?.invalid && memberForm.get('cin')?.touched">
      CIN est requis (e.g., 8 caractères).
    </small>
  </div>

  <!-- Name Field -->
  <div class="field mb-4">
    <label for="nom" class="block font-semibold mb-2">Nom</label>
    <input id="nom" type="text" pInputText placeholder="Nom" formControlName="nom" class="w-full">
    <small class="p-error block" *ngIf="memberForm.get('nom')?.invalid && memberForm.get('nom')?.touched">
      Nom est requis.
    </small>
  </div>

  <!-- Type Field -->
  <div class="field mb-4">
    <label for="type" class="block font-semibold mb-2">Type</label>
    <input id="type" type="text" pInputText placeholder="Type (e.g., Enseignant, Etudiant)" formControlName="type" class="w-full">
     <small class="p-error block" *ngIf="memberForm.get('type')?.invalid && memberForm.get('type')?.touched">
      Type est requis.
    </small>
  </div>

  <!-- Create Date Field (Display Only) -->
   <div class="field mb-4" *ngIf="isEditMode && memberForm.get('createDate')?.value">
    <label for="createDate" class="block font-semibold mb-2">Date de création</label>
    <input id="createDate" type="text" pInputText formControlName="createDate" class="w-full" [readonly]="true">
  </div>

</form>
<!-- Buttons handled by DialogService -->
