<div class="card">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>
  
  <div *ngIf="loading" class="flex justify-content-center">
    <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
  </div>
  
  <div *ngIf="!loading">
    <div *ngIf="member" class="mb-4">
      <h2>Publications for {{ member.nom }}</h2>
      
      <div *ngIf="publications.length === 0" class="p-4 text-center">
        <p>No publications found for this member.</p>
      </div>
      
      <p-table *ngIf="publications.length > 0" [value]="publications" styleClass="p-datatable-sm" [tableStyle]="{'min-width': '50rem'}">
        <ng-template pTemplate="header">
          <tr>
            <th>Title</th>
            <th>Type</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-pub>
          <tr>
            <td>{{ pub.titre }}</td>
            <td>
              <span [ngClass]="{
                'bg-primary-100 text-primary-700': pub.type === 'Conference',
                'bg-success-100 text-success-700': pub.type === 'Journal',
                'bg-warning-100 text-warning-700': pub.type === 'Book Chapter',
                'bg-info-100 text-info-700': pub.type === 'Workshop'
              }" class="px-2 py-1 text-xs rounded-md">
                {{ pub.type }}
              </span>
            </td>
            <td>{{ pub.date | date:'mediumDate' }}</td>
            <td>
              <div class="flex gap-2">
                <a [href]="pub.lien" target="_blank" pButton icon="pi pi-external-link" class="p-button-text p-button-rounded p-button-info"></a>
                <button pButton icon="pi pi-trash" class="p-button-text p-button-rounded p-button-danger" (click)="removePublication(pub.id)"></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
